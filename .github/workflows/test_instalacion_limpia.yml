name: Verificar instalación limpia de SharPicks

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/supabase.sql'
      - 'web/negocio.sql'
      - 'supabase/**.sql'
      - 'tests/test_instalacion_limpia.sql'
      - '.github/workflows/test_instalacion_limpia.yml'
  push:
    branches:
      - 'fix/sharpicks-clean-install-ddl-2026-10-18'
    paths:
      - 'web/supabase.sql'
      - 'web/negocio.sql'
      - 'supabase/**.sql'
      - 'tests/test_instalacion_limpia.sql'
      - '.github/workflows/test_instalacion_limpia.yml'

permissions:
  contents: read

concurrency:
  group: instalacion-limpia-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sharpicks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sharpicks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sharpicks_test
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Simular el esquema mínimo de Supabase Auth
        run: |
          set -eu
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE FUNCTION auth.role() RETURNS text
          LANGUAGE sql STABLE
          AS $$ SELECT coalesce(nullif(current_setting('request.jwt.claim.role', true), ''), 'anon') $$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.role() TO anon, authenticated, service_role;
          SQL
      - name: Ejecutar bootstrap y migraciones en orden
        run: |
          set -eu
          for file in \
            web/supabase.sql \
            web/negocio.sql \
            supabase/v383_usuarios_vip.sql \
            supabase/v389_monedas.sql \
            supabase/v394_ia_que_meter.sql \
            supabase/v395_stripe_renovacion.sql \
            supabase/v396_combinadas.sql \
            supabase/v397_desbloquear_combinada.sql \
            supabase/v399_ia_medicion.sql \
            supabase/v400_telegram.sql \
            supabase/v401_comentarios.sql \
            supabase/v402_bughunter_hardening.sql \
            supabase/v404_precios_cuota_canonico.sql \
            supabase/v405_comentarios_solo_edge.sql; do
            echo "::group::Aplicar $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done
      - name: Verificar tablas, permisos, precios e idempotencia
        run: psql -v ON_ERROR_STOP=1 -f tests/test_instalacion_limpia.sql
