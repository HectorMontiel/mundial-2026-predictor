name: Reentrenar modelos de ligas (datos frescos)

# CAUSA RAÍZ (v51): los modelos de liga solo se refrescaban con un commit
# manual, así que `team_stats_*.json` se quedaba semanas atrás y la UI marcaba
# "sin datos nuevos desde hace 60+ días". Este workflow reentrena todas las
# ligas con los CSV más recientes de football-data y commitea los artefactos,
# de modo que Streamlit Cloud (que despliega desde el repo) siempre sirva
# modelos al día. Las ligas en receso no cambian (no hay datos nuevos) — es
# correcto y honesto.

# v74 — DE DOS VECES POR SEMANA A DIARIO.
#
# El diagnóstico de v71/v73 culpó a football-data.co.uk de publicar «por lotes
# semanales». Se comprobó y es FALSO: el 2026-07-28 la fuente estaba al día de
# ayer en Dinamarca, Liga MX, Suecia y China. Lo que iba atrasado eran los CSV
# del repo, que solo se reescriben cuando corre este workflow.
#
# Con cron los lunes y jueves, un partido del viernes tardaba hasta 4 días en
# entrar en el estado del modelo. Medido en local: Dinamarca 71 días de desfase,
# China 8, Suecia 7, Liga MX 5.
#
# Diario a las 05:30 UTC: después de que football-data cierre la jornada
# europea y antes de la hora punta de uso.
on:
  schedule:
    - cron: '30 5 * * *'    # todos los días 05:30 UTC
  workflow_dispatch:          # ejecución manual desde la web de GitHub

# permiso para que el runner pueda commitear los modelos actualizados
permissions:
  contents: write

concurrency:
  group: retrain-leagues
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reentrenar todas las ligas disponibles
        run: |
          # league_engine --build descarga los CSV frescos de football-data y
          # reentrena cada liga disponible. Un fallo puntual no aborta el resto.
          python league_engine.py --build || echo "reentrenamiento con avisos, se continúa"

      # v68: NUNCA se commitea un modelo que no se pueda volver a cargar.
      # Contexto: el 2026-07-27 el bot publicó 22 `modelo.joblib` que no abrían
      # fuera del runner. El workflow había terminado "con éxito" porque nadie
      # comprobaba que el artefacto fuese legible — sólo que el proceso saliera
      # con código 0. Esta verificación cierra ese hueco: si un modelo no carga,
      # se restaura su versión anterior y el resto del reentrenamiento sigue.
      - name: Verificar que todos los modelos se pueden cargar
        run: |
          python - <<'PY'
          import glob, os, subprocess, sys
          import joblib
          malos = []
          for f in sorted(glob.glob('modelos/*/*.joblib')):
              try:
                  joblib.load(f)
              except Exception as e:
                  malos.append((f, f'{type(e).__name__}: {e}'))
          for f, err in malos:
              print(f'::warning::modelo ilegible, se restaura el anterior: {f} ({err})')
              subprocess.run(['git', 'checkout', '--', f], check=False)
          print(f'Modelos verificados. Ilegibles restaurados: {len(malos)}')
          if len(malos) > 10:
              print('::error::demasiados modelos ilegibles; no se publica nada.')
              sys.exit(1)
          PY

      - name: Commitear artefactos actualizados (si cambiaron)
        run: |
          git config user.name  "retrain-bot"
          git config user.email "actions@github.com"
          git add -A team_stats_*.json modelos/ historico_*.csv roi_bets_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios en los modelos (ligas en receso). Nada que commitear."
          else
            fecha=$(date -u +%Y-%m-%d)
            git commit -m "chore(datos): reentrenamiento automático de ligas ($fecha)"
            git push
            echo "Modelos actualizados y publicados."
          fi
