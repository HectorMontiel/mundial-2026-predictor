name: Recalibrar la cadena completa (semanal)

# v93 — POR QUÉ HACE FALTA UN WORKFLOW APARTE
#
# El diario (`retrain_leagues.yml`) reentrena los modelos de fútbol y refresca
# `team_stats`, así que las PREDICCIONES mejoran cada día. Pero las
# CALIBRACIONES que corrigen esas predicciones estaban congeladas en el día en
# que alguien las generó a mano. Auditado el 2026-08-03:
#
#     modelos de fútbol            1 día    ← se regeneraba
#     calibracion_mercado.json     1 día    ← se regeneraba
#     ───────────────────────────────────────────────────────
#     pick_ledger_total.csv        5 días   ← NUNCA
#     calibracion_confianza.json   3 días   ← NUNCA
#     umbrales_capa1.json          6 días   ← NUNCA
#     edge_map.json               11 días   ← NUNCA
#
# La inconsistencia es peor que la antigüedad: `calibracion_confianza` mide
# cuánto acierta DE VERDAD cada banda de probabilidad, y si el modelo se
# reentrena a diario y esa medición no, se está corrigiendo con la huella de un
# modelo que ya no existe.
#
# Va SEMANAL y no diario a propósito: reconstruir el ledger re-predice decenas
# de miles de partidos (~40 min). Las calibraciones se mueven despacio; hacerlo
# a diario sería gastar una hora de CI para cambiar el cuarto decimal.

on:
  schedule:
    - cron: '0 5 * * 1'          # lunes 05:00 UTC, después del reentrenamiento
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recalibrar:
    runs-on: ubuntu-latest
    # v189 — el paso 1 vuelve a re-predecir el histórico de verdad, que
    # es lo que este workflow siempre dijo que hacía: ~45 min de fútbol
    # más el tenis y el MLB. Antes concatenaba dos CSV y terminaba en 7.
    timeout-minutes: 180

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # El orden es estrictamente secuencial: todo cuelga del ledger. Cada paso
      # falla de forma independiente — un artefacto viejo es peor que uno
      # nuevo, pero mucho mejor que ninguno, así que lo que no se regenere
      # conserva el anterior en vez de quedarse a medias.
      # v96 — El histórico de ITF y challenger viene de un espejo de archivo
      # (los repos originales de Sackmann están borrados). Se refresca aquí,
      # semanalmente, y el resultado se commitea: una vez ingerido el dato ya
      # no depende de que ese espejo siga existiendo.
      - name: Refrescar el histórico de ITF y challenger
        run: python ingesta_itf.py --desde 2015 || echo "::warning::ingesta ITF con avisos"

      # v162 — EL FONDO DE HISTÓRICO DE ESTADÍSTICAS, UNA VEZ POR SEMANA.
      #
      # El paso diario de `retrain_leagues` sólo mira los últimos diez días,
      # que es lo que hace falta para no quedarse atrás. Esto es lo otro: bajar
      # las temporadas pasadas de las competiciones a las que aún les falten.
      #
      # Es caro la PRIMERA vez —unas 3-4 h para las 61, a ~0,05 s por partido—
      # y casi gratis después: `backfill` salta los `event_id` que ya están
      # guardados, así que en las semanas siguientes sólo baja lo que se haya
      # añadido. Va aquí y no en el job diario justamente por eso.
      #
      # Sin este fondo, una competición con dos temporadas de datos calibra
      # peor que con cinco, y las que ESPN no cubría en su día se quedarían
      # estimadas para siempre aunque ESPN las haya incorporado después.
      - name: Fondo histórico de estadísticas de ESPN
        continue-on-error: true
        # v189 — 100 min, no 240. El job entero dura 180 y el paso 1 de la
        # recalibración se lleva ahora unos 50: un paso con permiso para
        # tardar 240 mataba el job ANTES del commit, y entonces se pierde
        # todo lo demás. El fondo es lo prescindible de este workflow —por eso
        # lleva `continue-on-error`—, así que es el que cede el tiempo.
        timeout-minutes: 100
        run: |
          python stats_espn.py --desde 2021-01-01 || echo "::warning::fondo histórico con avisos"
          python stats_espn.py --limpiar || echo "::warning::limpieza con avisos"
          python stats_estimadas.py --ajustar || echo "::warning::ajuste con avisos"
          python informe_calibracion.py --md INFORME_CALIBRACION.md || echo "::warning::informe con avisos"

      - name: Recalibrar la cadena completa
        run: python recalibrar_todo.py || echo "::warning::recalibración con avisos"

      # v169 — EL RANKING DE ESTABILIDAD, REGENERADO AQUI Y NO A MANO.
      #
      # `mercado_estable_por_liga.json` decide de que mercado sale la
      # recomendacion de cada liga. Se construyo a mano en la v168 y eso tiene
      # fecha de caducidad: lee `_v162_calibracion_por_liga.json` y los TRES
      # ledgers walk-forward.
      #
      # v189 — Y POR ESO BAJA AQUI, detras de la recalibracion. Estaba dentro
      # del paso del fondo ESPN, o sea ANTES de que se reconstruyeran los
      # ledgers: coronaba a los mercados con la foto de la semana pasada. Su
      # otra condicion —ir despues del informe de calibracion— se sigue
      # cumpliendo, porque el informe queda mas arriba todavia.
      - name: Ranking de estabilidad por mercado
        run: python mercado_estabilidad.py || echo "::warning::ranking de estabilidad con avisos"

      - name: Publicar el estado de la recalibración
        run: |
          python - <<'PY'
          import json, os, sys
          if not os.path.exists('recalibracion_estado.json'):
              print('::warning::no se generó recalibracion_estado.json')
              sys.exit(0)
          d = json.load(open('recalibracion_estado.json', encoding='utf-8'))
          print(f"{d['ok']}/{len(d['pasos'])} pasos OK en {d['segundos_total']:.0f}s")
          for p in d['pasos']:
              print(f"  {'OK ' if p['ok'] else 'FALLO'} {p['paso']}: "
                    f"{p.get('detalle') or p.get('error')}")
          for f in d.get('fallos') or []:
              print(f'::warning::paso fallido: {f}')
          PY

      # v188 — Y SE MIRA QUE NADA SE HAYA QUEDADO PARADO.
      #
      # Va DESPUÉS de recalibrar y ANTES de commitear, que es el único
      # momento en que se sabe si la pasada de esta semana movió algo.
      # Tres ficheros llevaban entre tres y seis semanas congelados sin
      # que nada avisara, y el workflow terminaba en verde cada lunes.
      #
      # No rompe la pasada: avisa. Un check que la tumba por una liga en
      # receso se desactiva a la tercera semana.
      - name: Vigilar la frescura de los datos que aprenden
        run: |
          python frescura_datos.py \
            || echo "::warning::hay datos parados, mira frescura_datos.json"

      - name: Commitear las calibraciones actualizadas
        run: |
          git config user.name  "recalibrar-bot"
          git config user.email "actions@github.com"
          # v186 — SIN `modelos/`, Y SIN TRAGARSE EL FALLO.
          #
          # Este `git add` llevaba `modelos/tennis` y `modelos/tennis_wta`,
          # y desde la v161 (2026-08-22) `modelos/` está en .gitignore: sus
          # pesos viajan por el GitHub Release, no por el repositorio.
          # `git add` con un path ignorado **falla entero y no añade
          # NINGUNO de los demás** —comprobado, devuelve exit 1— y el
          # `|| true` se lo tragaba.
          #
          # Efecto medido: la recalibración corría cada lunes y sólo
          # commiteaba `_v162_calibracion_por_liga.json`, que va en su
          # propio `git add`. `pick_ledger_total.csv` llevaba desde el
          # 2026-07-29 sin actualizarse y `umbrales_capa1.json` desde el
          # 2026-07-28: seis semanas sin medir si los pronósticos
          # aciertan, con el workflow en verde.
          git add -A historico_itf.csv.gz \
                     pick_ledger_total.csv calibracion_confianza.json \
                     precision_ligas.json edge_map.json deportes_capa1.json \
                     calibracion_mercado.json umbrales_capa1.json \
                     recalibracion_estado.json frescura_datos.json \
                     _v75_pick_ledger.json _v78_ledger_deportes.json \
            || echo "::warning::git add de las calibraciones falló"
          # v162 — el fondo histórico de estadísticas de ESPN y lo que
          # se deriva de él. Sin commitearlo, el trabajo de 3-4 h del paso
          # de arriba se pierde con el runner.
          # v186 — aquí había un «\n» LITERAL en medio del comando, en
          # vez de un salto de línea: el shell lo pasaba como argumento y
          # el `git add` se rompía. Otro fallo callado por el `|| true`.
          git add -A stats_espn/ calibracion_stats_liga.json \
                     INFORME_CALIBRACION.md \
            || echo "::warning::git add del fondo de estadísticas falló"
          # v169 — y el ranking de estabilidad, que sale del informe de arriba.
          # v189 — sin `2>/dev/null || true`. Ese era EXACTAMENTE el patron
          # que escondio el bug de la v186 durante seis semanas: un `git add`
          # que falla, se calla, y el workflow termina en verde sin haber
          # anadido nada. Si falla, que se vea.
          git add -A mercado_estable_por_liga.json || echo "::warning::git add del ranking de estabilidad fallo"
          git add -A _v162_calibracion_por_liga.json || echo "::warning::git add de la calibracion por liga fallo"
          if git diff --cached --quiet; then
            echo "Las calibraciones no cambiaron esta semana."
          else
            fecha=$(date -u +%Y-%m-%d)
            git commit -m "chore(calibracion): recalibración semanal de la cadena ($fecha)"
            git push
            echo "Calibraciones actualizadas y publicadas."
          fi
